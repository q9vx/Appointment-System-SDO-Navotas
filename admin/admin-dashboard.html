<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - SDO Navotas</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="admin.js"></script>


<style>
body {
  padding-top: 70px;
  background-color: #f5f7f6;
  min-height: 100vh;
  overflow-x: hidden;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: #1a1a1a;
}

/* Hero Section */
.hero-section {
  position: relative;
  width: 100%;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 30px 15px;
}

.hero-img {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: blur(4px) brightness(0.7);
  z-index: 0;
}

.hero-overlay {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.2);
  z-index: 1;
}

/* Dashboard Card Container */
.card-appointments {
  position: relative;
  z-index: 2;
  width: 95%;
  max-width: 1400px;
  background-color: #fff;
  border-radius: 16px;
  padding: 40px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  margin-bottom: 50px;
}

/* Appointment Cards */
.appointment-card {
  background-color: #fff;
  border-left: 6px solid #1b4332;
  border-radius: 14px;
  padding: 25px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
  margin-bottom: 25px;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.appointment-card:hover {
  transform: translateY(-4px) scale(1.02);
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
}

.appointment-card h5 {
  font-weight: 600;
  margin-bottom: 10px;
}

.appointment-card p {
  margin-bottom: 6px;
  font-size: 0.95rem;
}

/* Status Tracker */
.status-tracker {
  display: flex;
  gap: 20px;
  margin-top: 15px;
  flex-wrap: wrap;
}

.status-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 50px;
}

.status-circle {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background-color: #ccc;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  transition: background-color 0.3s ease;
}

.status-active {
  background-color: #1b4332;
}

.status-completed {
  background-color: #4caf50;
}

.status-step span {
  margin-top: 5px;
  font-size: 0.75rem;
  text-align: center;
  color: #555;
}

/* Search & Filter */
.search-filter-container {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  margin-bottom: 25px;
}

.search-filter-container input,
.search-filter-container select,
.search-filter-container button {
  padding: 8px 15px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 0.95rem;
  outline: none;
}

.search-filter-container input:focus,
.search-filter-container select:focus {
  border-color: #1b4332;
  box-shadow: 0 0 8px rgba(27,67,50,0.2);
}

/* Action Buttons */
.appointment-card .btn {
  font-size: 0.85rem;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-sm { font-size: 0.8rem; padding: 5px 10px; }
.btn-success:hover { background-color: #14532d; }
.btn-danger:hover { background-color: #7f1d1d; }

/* Guest Overlay */
#guestOverlay {
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(5px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  text-align: center;
  padding: 25px;
  flex-direction: column;
}

#guestOverlay h2,
#guestOverlay p {
  background: rgba(255, 255, 255, 0.95);
  padding: 12px 25px;
  border-radius: 12px;
  display: inline-block;
  max-width: 90%;
  margin: 8px 0;
}

/* Footer */
footer {
  background-color: #1b4332;
  color: #d4edda;
  text-align: center;
  padding: 22px 10px;
  font-size: 0.9rem;
  margin-top: 40px;
  border-top-left-radius: 12px;
  border-top-right-radius: 12px;
}

/* Responsive */
@media (max-width: 1024px) {
  .card-appointments { padding: 30px; }
  .appointment-card { padding: 20px; }
  .status-tracker { gap: 15px; }
}

@media (max-width: 768px){
  .card-appointments { padding: 20px; }
  .appointment-card { padding: 15px; border-left-width: 4px; }
  .status-tracker { gap: 10px; justify-content: flex-start; }
  .status-step span { font-size: 0.7rem; }
  .search-filter-container { flex-direction: column; }
}

@media (max-width: 480px){
  .appointment-card h5 { font-size: 1rem; }
  .appointment-card p { font-size: 0.85rem; }
}
</style>
</head>

<body>
<div id="guestOverlay">
  <h2>Access denied. Admins only.</h2>
  <button id="GoHomepage" class="btn btn-primary btn-lg mt-3">Go to Homepage</button>
</div>

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm fixed-top" style="background-color:#1b4332;">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="../index.html">
      <img src="../assets/logo.png" width="50" height="50" class="me-2">
      <span class="fw-bold">SDO Navotas Admin Panel</span>
    </a>
  </div>
</nav>

<div class="hero-section">
  <img src="../assets/school-hero2.jpg" class="hero-img" alt="School">
  <div class="hero-overlay"></div>

<div class="hero-content">
  <div class="card-appointments">
    <h2 class="fw-bold mb-4 text-center">📋 Manage Appointments</h2>

    <!-- Search & Filter -->
    <div class="d-flex flex-wrap gap-2 mb-3">
      <input type="text" id="searchInput" class="form-control flex-grow-1" placeholder="Search by user or purpose">
      <select id="statusFilter" class="form-select w-auto">
        <option value="">All Statuses</option>
        <option value="Pending">Pending</option>
        <option value="Confirmed">Confirmed</option>
        <option value="Completed">Completed</option>
        <option value="Cancelled">Cancelled</option>
      </select>
      <button id="clearFilters" class="btn btn-secondary">Clear</button>
    </div>

    <!-- Appointments list -->
    <div id="appointmentsList" class="appointment-card-container">
      <p class="text-center text-muted">Loading appointments...</p>
    </div>
  </div>
</div>


<footer>
  <p>© 2025 Schools Division Office of Navotas City | Admin View</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
