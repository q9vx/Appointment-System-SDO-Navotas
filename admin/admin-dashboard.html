<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Teacher Appointment System</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    .appointment-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .timeline {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .timeline-step {
      flex: 1;
      padding: 5px 10px;
      border: 1px solid #ccc;
      text-align: center;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.2s;
    }

    .timeline-step.active {
      background-color: #0d6efd;
      color: #fff;
      font-weight: bold;
    }

    .timeline-step:hover {
      background-color: #e9ecef;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="assets/logo.png" alt="SDO Navotas" width="50" height="50" class="me-2">
        <span class="fw-bold">Admin Dashboard</span>
      </a>
      <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
    </div>
  </nav>

  <!-- Main container -->
  <div class="container my-4">
    <h3 class="mb-4">All Appointments</h3>
    <div id="appointment-list"></div>
  </div>

  <!-- Footer -->
  <footer class="bg-light text-center py-3 mt-5 shadow-sm">
    <p>© 2025 Schools Division Office of Navotas City. All rights reserved.</p>
  </footer>

  <!-- Firebase compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  
  <!-- Config & Admin script -->
  <script src="js/firebase-config.js"></script>
  <script src="js/admin.js"></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
