<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Appointment System</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">Admin Dashboard</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
  </div>
</nav>

<div class="container my-5">
  <h3 class="text-center mb-4">📋 All Appointments</h3>

  <div class="table-responsive">
    <table class="table table-bordered table-striped align-middle">
      <thead class="table-dark">
        <tr>
          <th>User</th>
          <th>Date</th>
          <th>Time</th>
          <th>Reason</th>
          <th>Status</th>
          <th>Update</th>
        </tr>
      </thead>
      <tbody id="appointmentsTable">
        <tr><td colspan="6" class="text-center">Loading appointments...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<footer class="bg-light text-center py-3 shadow-sm">
  <p>© 2025 Schools Division Office of Navotas City | Admin View</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const appointmentsTable = document.getElementById("appointmentsTable");
  
  firebase.auth().onAuthStateChanged(async (user) => {
    if (!user) {
      appointmentsTable.innerHTML = `<tr><td colspan="6" class="text-center text-danger">⚠ Please log in as Admin.</td></tr>`;
      return;
    }

    try {
      const snapshot = await db.collection("appointments")
        .orderBy("createdAt", "desc")
        .get();

      if (snapshot.empty) {
        appointmentsTable.innerHTML = `<tr><td colspan="6" class="text-center">No appointments available.</td></tr>`;
        return;
      }

      let rows = "";
      snapshot.forEach(doc => {
        const data = doc.data();

        rows += `
          <tr>
            <td>${data.email}</td>
            <td>${data.appointmentDate}</td>
            <td>${data.appointmentTime}</td>
            <td>${data.reason}</td>
            <td>
              <span class="badge bg-${getBadgeClass(data.status)}">${data.status}</span>
            </td>
            <td>
              <select class="form-select form-select-sm" onchange="updateStatus('${doc.id}', this.value)">
                <option value="Pending" ${data.status === "Pending" ? "selected" : ""}>Pending</option>
                <option value="Confirmed" ${data.status === "Confirmed" ? "selected" : ""}>Confirmed</option>
                <option value="Cancelled" ${data.status === "Cancelled" ? "selected" : ""}>Cancelled</option>
                <option value="Completed" ${data.status === "Completed" ? "selected" : ""}>Completed</option>
              </select>
            </td>
          </tr>
        `;
      });

      appointmentsTable.innerHTML = rows;
    } catch (error) {
      console.error("Error loading appointments:", error);
      appointmentsTable.innerHTML = `<tr><td colspan="6" class="text-center text-danger">❌ Failed to load.</td></tr>`;
    }
  });

  // Badge color helper
  function getBadgeClass(status) {
    if (status === "Pending") return "warning";
    if (status === "Confirmed") return "success";
    if (status === "Cancelled") return "danger";
    if (status === "Completed") return "primary";
    return "secondary";
  }

  // Update appointment status
  async function updateStatus(docId, newStatus) {
    try {
      await db.collection("appointments").doc(docId).update({ status: newStatus });
      console.log(`✅ Status updated to ${newStatus}`);
    } catch (error) {
      console.error("Error updating status:", error);
      alert("❌ Failed to update status.");
    }
  }
</script>

</body>
</html>
