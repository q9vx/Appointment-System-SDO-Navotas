<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Teacher Appointment System</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="assets/logo.png" alt="SDO Navotas" width="60" height="60" class="me-2">
      <span class="fw-bold">SDO Navotas Appointment System</span>
    </a>
  </div>
</nav>

<div class="hero-section position-relative text-center text-white">
  <img src="assets/school-hero.jpg" alt="Schools Division Office" class="hero-img">
  <div class="position-absolute top-50 start-50 translate-middle px-3" style="width: 100%; max-width: 400px;">

    <h3 class="text-center mb-4">Login</h3>
    <form id="loginForm">
      <div class="mb-3">
        <label for="role" class="form-label">I am a</label>
        <select class="form-select" id="role" required>
          <option value="" disabled selected>Select your role</option>
          <option value="teacher">Teacher</option>
          <option value="student">Student</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="loginId" class="form-label">Teacher/Student ID</label>
        <input type="text" class="form-control" id="loginId" placeholder="Enter your ID number" required>
      </div>

      <div class="mb-3">
        <label for="loginEmail" class="form-label">Email address</label>
        <input type="email" class="form-control" id="loginEmail" placeholder="your.email@example.com" required>
      </div>

      <div class="mb-3">
        <label for="loginPassword" class="form-label">Password</label>
        <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <p class="text-center mt-3 mb-0">Don’t have an account? <a href="signup.html">Sign up</a></p>
    <div id="loginError" class="text-danger text-center mt-2"></div>
  </div>
</div>

<footer class="bg-light text-center py-3 mt-5 shadow-sm">
  <p>© 2025 Schools Division Office of Navotas City. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/login.js"></script>
</body>
</html>
