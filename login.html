<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Teacher Appointment System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>

<style>
.hero-section {
position: relative;
height: 100vh;
overflow: hidden;
display: flex;
align-items: center;
justify-content: center;
}

.hero-img {
width: 100%;
height: 100%;
object-fit: cover;
}

.hero-overlay {
position: absolute;
bottom: 0;
left: 50%;
transform: translateX(-50%);
width: 100%;
height: 100%;
background: linear-gradient(
to top,
rgba(255,255,255,1) 0%,
rgba(255, 255, 255, 0.295) 100%
);
z-index: 1;
}

.hero-content {
position: absolute;
bottom: 0;
left: 0;
width: 100%;
height: 100%;
display: flex;
align-items: center;
justify-content: center;
z-index: 2;
}

.signup-form-container {
background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
border: none;
box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
border-radius: 15px;
padding: 2rem;
transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.signup-form-container:hover {
transform: translateY(-5px);
box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
}

.form-label {
font-weight: 600;
color: #495057;
margin-bottom: 0.5rem;
}

.form-control, .form-select {
border: 1px solid #dee2e6;
transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

.form-control:focus, .form-select:focus {
border-color: #007bff;
box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
}

.input-group .form-control {
border-right: none;
}

.input-group .btn {
border-left: none;
background-color: #f8f9fa;
border-color: #dee2e6;
}

.btn-primary {
background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
border: none;
border-radius: 25px;
padding: 0.75rem 1.5rem;
font-weight: 600;
transition: background 0.3s ease, transform 0.2s ease;
}

.btn-primary:hover {
background: linear-gradient(135deg, #0056b3 0%, #004085 100%);
transform: translateY(-2px);
}

.form-check-label {
font-size: 0.9rem;
color: #6c757d;
}

.form-check-label a {
color: #007bff;
text-decoration: none;
}

.form-check-label a:hover {
text-decoration: underline;
}

footer {
background-color: #086e3b;
color: #000000;
padding: 30px;
text-align: center;
}
   footer a{
      color: rgb(1, 111, 255)
    }
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
<div class="container-fluid">
<a class="navbar-brand d-flex align-items-center" href="index.html">
<img src="assets/logo.png" alt="SDO Navotas" width="60" height="60" class="me-2">
<span class="fw-bold">SDO Navotas Appointment System</span>
</a>
</div>
</nav>
<div class="hero-section">
<img src="assets/school-hero.jpg" alt="Schools Division Office" class="hero-img">
<div class="hero-overlay"></div>

<div class="hero-content">
<div class="signup-form-container w-100" style="max-width: 450px;">
<h3 class="text-center mb-4">Login</h3>
<form id="loginForm">
<div class="mb-3">
<label for="role" class="form-label">I am a</label>
<select class="form-select" id="role" required>
<option value="" disabled selected>Select your role</option>
<option value="teacher">Teacher</option>
<option value="student">Student</option>
</select>
</div>

<div class="mb-3">
<label for="loginId" class="form-label">Teacher/Student ID</label>
<input type="text" class="form-control" id="loginId" placeholder="Enter your ID number" required>
</div>

<div class="mb-3">
<label for="loginEmail" class="form-label">Email address</label>
<input type="email" class="form-control" id="loginEmail" placeholder="your.email@domain.com" required>
</div>

<div class="mb-3">
<label for="loginPassword" class="form-label">Password</label>
<div class="input-group">
<input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
<button class="btn btn-outline-secondary" type="button" id="toggleLoginPassword">
<i class="bi bi-eye"></i>
</button>
</div>
<div class="text-end mt-1">
<a href="forgot-password.html" class="small text-decoration-none">Forgot password?</a>
</div>
</div>

<div class="mb-3 form-check">
<input type="checkbox" class="form-check-input" id="rememberMe">
<label class="form-check-label" for="rememberMe">Remember me</label>
</div>

<button type="submit" class="btn btn-primary w-100" id="loginBtn">
<span class="spinner-border spinner-border-sm me-2" id="loginSpinner" style="display: none;" role="status" aria-hidden="true"></span>
Login
</button>
</form>
<p class="text-center mt-3 mb-0">Don’t have an account? <a href="signup.html">Sign up</a></p>
<div id="loginError" class="text-danger text-center mt-2"></div>
</div>
</div>
</div>

<footer class="bg-light text-center py-3 mt-5 shadow-sm">
<p>© 2025 Schools Division Office of Navotas City. All rights reserved. | <a href="#">Terms of Service</a></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/login.js"></script>
</body>
</html>
