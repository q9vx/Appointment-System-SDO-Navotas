<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/logo.png" type="image/png">
<title>Forgot Password - Teacher Appointment System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/forgot-password.css">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>


</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
<div class="container-fluid">
<a class="navbar-brand d-flex align-items-center" href="index.html">
<img src="assets/logo.png" alt="SDO Navotas" width="60" height="60" class="me-2">
<span class="fw-bold">SDO Navotas Appointment System</span>
</a>
</div>
</nav>

<div class="hero-section">
<img src="assets/school-hero.jpg" alt="Schools Division Office" class="hero-img">
<div class="hero-overlay"></div>

<div class="hero-content">
<div class="bg-white p-4 rounded shadow-sm w-100" style="max-width: 450px;">
<h3 class="text-center mb-3">Forgot Password</h3>
<p class="small text-muted bg-light text-dark rounded py-2 px-3">
Enter your registered email and we’ll send you a reset link.
</p>

<form id="forgotPasswordForm">
<div class="mb-3">
<label for="resetEmail" class="form-label">Email address</label>
<input type="email" class="form-control" id="resetEmail" placeholder="your.email@example.com" required>
</div>
<button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
</form>

<div id="resetMessage" class="text-center mt-3 small"></div>

<p class="text-center mt-3 mb-0">
<a href="login.html">Back to Login</a>
</p>
</div>
</div>
</div>

<footer class="bg-light text-center py-3 mt-5 shadow-sm">
<p>© 2025 Schools Division Office of Navotas City. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/forgot-password.js"></script>
</body>
</html>
