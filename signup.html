<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Teacher Appointment System</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="assets/logo.png" alt="SDO Navotas" width="60" height="60" class="me-2">
      <span class="fw-bold">SDO Navotas Appointment System</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="terms.html">Terms of Service</a></li>
        <li class="nav-item ms-lg-3">
          <a class="nav-link p-0 active" href="login.html" title="Login">
            <i class="bi bi-person-circle fs-4"></i>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="hero-section position-relative text-center text-white">
  <img src="assets/school-hero.jpg" alt="Schools Division Office" class="hero-img">

  <div class="position-absolute top-50 start-50 translate-middle px-3" style="width: 100%; max-width: 500px;">
      <h3 class="text-center mb-4">Sign Up</h3>
      <form>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="firstName" class="form-label">First Name</label>
            <input type="text" class="form-control" id="firstName" placeholder="Name" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="lastName" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="lastName" placeholder="Surname" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="signupEmail" class="form-label">Email address</label>
          <input type="email" class="form-control" id="signupEmail" placeholder="your.email@example.com" required>
        </div>

        <div class="mb-3">
          <label for="signupRole" class="form-label">Role</label>
          <select class="form-select" id="role" onchange="toggleIdField()" required>
            <option value="">Select your role</option>
            <option value="teacher">Teacher</option>
            <option value="student">Student</option>
          </select>
        </div>

<div class="mb-3" id="teacherIdField" style="display: none;">
  <label for="teacherId" class="form-label">Teacher ID</label>
  <input type="text" class="form-control" id="teacherId" placeholder="Enter your Teacher ID">
</div>

<div class="mb-3" id="studentIdField" style="display: none;">
  <label for="studentId" class="form-label">Student ID</label>
  <input type="text" class="form-control" id="studentId" placeholder="Enter your Student ID">
</div>

        <div class="mb-3">
          <label for="signupPassword" class="form-label">Password</label>
          <input type="password" class="form-control" id="signupPassword" placeholder="Enter your password" required>
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Sign Up</button>
      </form>
      <p class="text-center mt-3 mb-0">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </div>
  </div>
</div>

<footer class="bg-light text-center py-3 mt-5 shadow-sm">
  <p>© 2025 Schools Division Office of Navotas City. All rights reserved. | <a href="#">Terms of Service</a></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function toggleIdField() {
      const role = document.getElementById("role").value;
      const teacherField = document.getElementById("teacherIdField");
      const studentField = document.getElementById("studentIdField");
// dwadawdawdawdwa
      teacherField.style.display = "none";
      studentField.style.display = "none";

      if (role === "teacher") {
        teacherField.style.display = "block";
        document.getElementById("teacherId").required = true;
        document.getElementById("studentId").required = false;
      } else if (role === "student") {
        studentField.style.display = "block";
        document.getElementById("studentId").required = true;
        document.getElementById("teacherId").required = false;
      }
    }
  </script>

<script src="js/signup.js"></script>
</body>
</html>
