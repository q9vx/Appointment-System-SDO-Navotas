<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Teacher Appointment System</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <style>
    .hero-section {
      position: relative;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-overlay {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to top,
        rgba(255,255,255,1) 0%,
        rgba(255, 255, 255, 0.295) 100%
      );
      z-index: 1;
    }

    .hero-content {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .signup-form-container {
      background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
      border: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      border-radius: 15px;
      padding: 2rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .signup-form-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
    }

    .form-label {
      font-weight: 600;
      color: #495057;
      margin-bottom: 0.5rem;
    }

    .form-control, .form-select {
      border: 1px solid #dee2e6;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .form-control:focus, .form-select:focus {
      border-color: #007bff;
      box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }

    .input-group .form-control {
      border-right: none;
    }

    .input-group .btn {
      border-left: none;
      background-color: #f8f9fa;
      border-color: #dee2e6;
    }

    .btn-primary {
      background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
      border: none;
      border-radius: 25px;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #0056b3 0%, #004085 100%);
      transform: translateY(-2px);
    }

    .form-check-label {
      font-size: 0.9rem;
      color: #6c757d;
    }

    .form-check-label a {
      color: #007bff;
      text-decoration: none;
    }

    .form-check-label a:hover {
      text-decoration: underline;
    }

    footer {
      background-color: #086e3b;
      color: #000000;
      padding: 30px;
      text-align: center;
    }
     footer a{
      color: rgb(1, 111, 255)
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="assets/logo.png" alt="SDO Navotas" width="60" height="60" class="me-2">
      <span class="fw-bold">SDO Navotas Appointment System</span>
    </a>
  </div>
</nav>

<div class="hero-section">
  <img src="assets/school-hero.jpg" alt="Schools Division Office" class="hero-img">
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <div class="signup-form-container w-100" style="max-width: 500px;">
      <h3 class="text-center mb-4">Sign Up</h3>
      <form>
        <div class="row g-3">
          <div class="col-md-6 mb-3">
            <label for="firstName" class="form-label">First Name</label>
            <input type="text" class="form-control shadow-sm border-0 rounded-3" id="firstName" placeholder="Name" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="lastName" class="form-label">Last Name</label>
            <input type="text" class="form-control shadow-sm border-0 rounded-3" id="lastName" placeholder="Surname" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="signupEmail" class="form-label">Email address</label>
          <input type="email" class="form-control shadow-sm border-0 rounded-3" id="signupEmail" placeholder="your.email@domain.com" required>
        </div>

        <div class="mb-3">
          <label for="signupRole" class="form-label">Role</label>
          <select class="form-select shadow-sm border-0 rounded-3" id="role" onchange="toggleIdField()" required>
            <option value="">Select your role</option>
            <option value="teacher">Teacher</option>
            <option value="student">Student</option>
          </select>
        </div>

        <div class="mb-3" id="teacherIdField" style="display: none;">
          <label for="teacherId" class="form-label">Teacher ID</label>
          <input type="text" class="form-control shadow-sm border-0 rounded-3" id="teacherId" placeholder="Enter your Teacher ID">
        </div>

        <div class="mb-3" id="studentIdField" style="display: none;">
          <label for="studentId" class="form-label">Student ID</label>
          <input type="text" class="form-control shadow-sm border-0 rounded-3" id="studentId" placeholder="Enter your Student ID">
        </div>

        <div class="mb-3">
          <label for="signupPassword" class="form-label">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="signupPassword" placeholder="Enter your password" required>
            <button class="btn btn-outline-secondary" type="button" id="toggleSignupPassword">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div id="passwordStrength" class="mt-2">
            <div class="progress" style="height: 5px;">
              <div class="progress-bar" id="strengthBar" role="progressbar" style="width: 0%"></div>
            </div>
            <small id="strengthText" class="text-muted">Password strength</small>
          </div>
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter your password" required>
            <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="termsCheckbox" required>
          <label class="form-check-label" for="termsCheckbox">I agree to the <a href="terms.html" target="_blank">Terms of Service</a></label>
        </div>

        <button type="submit" class="btn btn-primary w-100" id="signupBtn">
          <span class="spinner-border spinner-border-sm me-2" id="loadingSpinner" style="display: none;" role="status" aria-hidden="true"></span>
          Sign Up
        </button>
      </form>

      <div class="text-center mt-3" style="display:none;">
        <p>Or sign up with</p>
        <button class="btn btn-outline-danger me-2" id="googleSignup" aria-label="Sign up with Google"><i class="bi bi-google"></i> Google</button>
        <button class="btn btn-outline-primary" id="facebookSignup" aria-label="Sign up with Facebook"><i class="bi bi-facebook"></i> Facebook</button>
      </div>

      <div id="successMessage" class="alert alert-success mt-3" style="display: none;"></div>

      <p class="text-center mt-3 mb-0">
        Already have an account? <a href="login.html">Login</a>
      </p>
      
    </div>
  </div>
</div>

<footer class="bg-light text-center py-3 mt-5 shadow-sm">
  <p>© 2025 Schools Division Office of Navotas City. All rights reserved. | <a href="terms.html">Terms of Service</a></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  function toggleIdField() {
    const role = document.getElementById("role").value;
    const teacherField = document.getElementById("teacherIdField");
    const studentField = document.getElementById("studentIdField");

    teacherField.style.display = "none";
    studentField.style.display = "none";

    if (role === "teacher") {
      teacherField.style.display = "block";
      document.getElementById("teacherId").required = true;
      document.getElementById("studentId").required = false;
    } else if (role === "student") {
      studentField.style.display = "block";
      document.getElementById("studentId").required = true;
      document.getElementById("teacherId").required = false;
    }
  }
</script>

<script src="js/signup.js"></script>
</body>
</html>
