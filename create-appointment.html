<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Appointment - Teacher Appointment System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="assets/logo.png" alt="SDO Navotas" width="60" height="60" class="me-2">
      <span class="fw-bold">SDO Navotas Appointment System</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="my-appointments.html">My Appointments</a></li>
        <li class="nav-item ms-lg-3">
          <a class="nav-link p-0 active" href="create-appointment.html" title="Create Appointment">
            <i class="bi bi-calendar-plus fs-4"></i>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="hero-section position-relative text-center text-white">
  <img src="assets/school-hero.jpg" alt="Schools Division Office" class="hero-img">

  <div class="position-absolute top-50 start-50 translate-middle px-3" style="width: 100%; max-width: 500px;">
    <div class="card shadow-lg p-4 rounded-4">
      <h3 class="text-center mb-4">Create Appointment</h3>
      <form id="appointmentForm">
        <div class="mb-3">
          <label for="fullName" class="form-label">Full Name</label>
          <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" placeholder="your.email@example.com" required>
        </div>

        <div class="mb-3">
          <label for="role" class="form-label">I am a</label>
          <select class="form-select" id="role" onchange="toggleIdField()" required>
            <option value="">Select role</option>
            <option value="teacher">Teacher</option>
            <option value="student">Student</option>
          </select>
        </div>

        <div class="mb-3" id="teacherIdField" style="display: none;">
          <label for="teacherId" class="form-label">Teacher ID</label>
          <input type="text" class="form-control" id="teacherId" placeholder="Enter your Teacher ID">
        </div>

        <div class="mb-3" id="studentIdField" style="display: none;">
          <label for="studentId" class="form-label">Student ID</label>
          <input type="text" class="form-control" id="studentId" placeholder="Enter your Student ID">
        </div>

        <div class="mb-3">
          <label for="appointmentDate" class="form-label">Select Date</label>
          <input type="date" class="form-control" id="appointmentDate" required>
        </div>

        <div class="mb-3">
          <label for="appointmentTime" class="form-label">Select Time</label>
          <input type="time" class="form-control" id="appointmentTime" required>
        </div>

        <div class="mb-3">
          <label for="reason" class="form-label">Reason for Appointment</label>
          <textarea class="form-control" id="reason" rows="3" placeholder="Enter your reason" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100">Book Appointment</button>
      </form>

      <p class="text-center mt-3 mb-0">
        <a href="my-appointments.html">View My Appointments</a>
      </p>
    </div>
  </div>
</div>

<footer class="bg-light text-center py-3 mt-5 shadow-sm">
  <p>© 2025 Schools Division Office of Navotas City. All rights reserved. | <a href="#">Terms of Service</a></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Show/Hide Teacher or Student ID field
  function toggleIdField() {
    const role = document.getElementById("role").value;
    const teacherField = document.getElementById("teacherIdField");
    const studentField = document.getElementById("studentIdField");

    teacherField.style.display = "none";
    studentField.style.display = "none";

    if (role === "teacher") {
      teacherField.style.display = "block";
      document.getElementById("teacherId").required = true;
      document.getElementById("studentId").required = false;
    } else if (role === "student") {
      studentField.style.display = "block";
      document.getElementById("studentId").required = true;
      document.getElementById("teacherId").required = false;
    }
  }

  // Firestore appointment form handler
  const form = document.getElementById("appointmentForm");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const fullName = document.getElementById("fullName").value;
    const email = document.getElementById("email").value;
    const role = document.getElementById("role").value;
    const teacherId = document.getElementById("teacherId").value || null;
    const studentId = document.getElementById("studentId").value || null;
    const date = document.getElementById("appointmentDate").value;
    const time = document.getElementById("appointmentTime").value;
    const reason = document.getElementById("reason").value;

    try {
      await db.collection("appointments").add({
        fullName,
        email,
        role,
        teacherId,
        studentId,
        appointmentDate: date,
        appointmentTime: time,
        reason,
        status: "Pending", // default
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      alert("✅ Appointment created successfully!");
      form.reset();
      toggleIdField(); // reset hidden fields
    } catch (error) {
      console.error("Error adding appointment: ", error);
      alert("❌ Failed to create appointment. Please try again.");
    }
  });
</script>
</body>
</html>
