<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Appointment - SDO Navotas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="guestOverlay" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    backdrop-filter: blur(8px);
    background-color: rgba(0,0,0,0.3);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    color: white;
    font-size: 1.5rem;
">
  <p>⚠️ You must create an account first to access this page.</p>
  <button id="goSignup" class="btn btn-light mt-3">Create Account</button>
</div>

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="assets/logo.png" alt="SDO Navotas" width="50" height="50" class="me-2">
      <span class="fw-bold">SDO Navotas Teachers Appointment System</span>
    </a>
    <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
            aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="my-appointments.html">My Appointments</a></li>
        <li class="nav-item"><a class="nav-link active" href="create-appointment.html">Create Appointment</a></li>
        <li class="nav-item"><a class="nav-link" id="navProfile" href="#"><i class="bi bi-person-circle fs-4"></i></a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="hero-section">
  <img src="assets/school-hero.jpg" alt="Schools Division Office" class="hero-img">
  <div class="hero-overlay"></div>
  <div class="hero-content d-flex align-items-center justify-content-center">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8">
          <div class="card shadow-lg p-4 rounded-4">
            <h3 class="text-center mb-4">Create a New Appointment</h3>

            <form id="createAppointmentForm">
              <div class="mb-3">
                <label for="reason" class="form-label">Reason / Purpose</label>
                <input type="text" class="form-control" id="reason" placeholder="Enter reason for appointment" required>
              </div>

              <div class="mb-3">
                <label for="date" class="form-label">Date</label>
                <input type="date" class="form-control" id="date" required>
              </div>

              <div class="mb-3">
                <label for="time" class="form-label">Time</label>
                <input type="time" class="form-control" id="time" required>
              </div>

              <div class="mb-3">
                <label for="notes" class="form-label">Additional Notes</label>
                <textarea class="form-control" id="notes" rows="3" placeholder="Optional notes"></textarea>
              </div>

              <div class="text-center mt-4">
                <button type="submit" class="btn btn-success px-4">
                  <i class="bi bi-check-circle me-2"></i> Submit Appointment
                </button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="text-center py-3 shadow-sm" style="background-color: #1b4332; color: #d4edda;">
  <p class="mb-1">© 2025 Schools Division Office of Navotas City. All rights reserved.</p>
  <a href="#" class="text-white small">Terms of Service</a>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/create-appointment.js"></script>
<script>
  const auth = firebase.auth();
  const navProfile = document.getElementById("navProfile");

  auth.onAuthStateChanged(user => {
    if (user) {
      navProfile.href = "dashboard.html";
    } else {
      navProfile.href = "login.html";
    }
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>

</body>
</html>
