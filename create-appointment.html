<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Appointment</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
  <script src="js/firebase-config.js" defer></script>
  <script src="js/dashboard.js" defer></script>
</head>
<body>

  <!-- Header -->
  <header class="bg-light shadow-sm py-3 mb-4">
    <div class="container text-center">
      <h1 class="h3 fw-bold">Create Appointment</h1>
    </div>
  </header>

  <!-- Main Form -->
  <main class="container mb-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title mb-4 text-center">New Appointment</h3>
            <form id="appointmentForm">
              
              <!-- Date & Time -->
              <div class="mb-3">
                <label for="dateTime" class="form-label">Date & Time:</label>
                <input type="datetime-local" id="dateTime" class="form-control" required>
              </div>

              <!-- Notes -->
              <div class="mb-3">
                <label for="notes" class="form-label">Notes (optional):</label>
                <textarea id="notes" class="form-control" placeholder="Add any notes here..."></textarea>
              </div>

              <!-- Buttons -->
              <div class="d-flex flex-column flex-sm-row justify-content-between">
                <button type="submit" class="btn btn-primary mb-2 mb-sm-0 w-100 w-sm-auto">Create Appointment</button>
                <button type="button" id="backBtn" class="btn btn-secondary w-100 w-sm-auto">Back to Dashboard</button>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-light text-center py-3 mt-5 shadow-sm">
    <p>© 2025 Schools Division Office of Navotas City. All rights reserved. | <a href="#">Terms of Service</a></p>
  </footer>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
