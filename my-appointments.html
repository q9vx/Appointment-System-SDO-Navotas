<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Appointments - SDO Navotas Appointment System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/status-tracker.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="assets/logo.png" alt="SDO Navotas" width="50" height="50" class="me-2">
      <span class="fw-bold">SDO Navotas Teachers Appointment System</span>
    </a>
    <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
            aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-door me-1"></i> Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="my-appointments.html"><i class="bi bi-calendar3 me-1"></i> My Appointments</a></li>
        <li class="nav-item"><a class="nav-link" href="create-appointment.html"><i class="bi bi-plus-circle me-1"></i> Create Appointment</a></li>
        <li class="nav-item"><a class="nav-link" id="navProfile" href="#"><i class="bi bi-person-circle fs-4"></i></a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="hero-section">
  <img src="assets/school-hero.jpg" alt="Schools Division Office" class="hero-img">
  <div class="hero-overlay"></div>
  <div class="hero-content d-flex align-items-center">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8">
          <div class="card shadow-lg rounded-4 p-4">
            <h2 class="fw-bold mb-4 text-center">My Appointments</h2>
            <div id="appointmentsList" class="mb-3">
              <p class="text-center text-muted">Loading your appointments...</p>
            </div>
            <div class="text-center mt-3">
              <a href="create-appointment.html" class="btn btn-primary btn-lg">
                <i class="bi bi-plus-circle me-2"></i> New Appointment
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="text-center py-3 shadow-sm" style="background-color: #1b4332; color: #d4edda;">
  <p class="mb-1">© 2025 Schools Division Office of Navotas City. All rights reserved.</p>
  <a href="#" class="text-white small">Terms of Service</a>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js" defer></script>
<script src="js/my-appointments.js" defer></script>
<script>
  const auth = firebase.auth();
  const navProfile = document.getElementById("navProfile");

  auth.onAuthStateChanged(user => {
    if (user) {
      navProfile.href = "dashboard.html";
    } else {
      navProfile.href = "login.html";
    }
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>

</body>
</html>
