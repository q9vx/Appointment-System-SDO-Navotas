<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
  <script src="js/firebase-config.js" defer></script>
  <script src="js/dashboard.js" defer></script>
</head>
<body>
  <!-- Header -->
  <nav class="navbar navbar-light bg-light shadow-sm mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Teacher Dashboard</span>
      <button id="logoutBtn" class="btn btn-danger">Logout</button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>My Appointments</h2>
      <button id="createBtn" class="btn btn-success">+ Create New Appointment</button>
    </div>

    <!-- Appointment List -->
<div id="appointment-list" class="row g-3">
  <!-- JS injects cards here -->
</div>

  </main>

  <!-- Footer -->
  <footer class="bg-light text-center py-3 mt-5 shadow-sm">
    <p>© 2025 Schools Division Office of Navotas City. All rights reserved.</p>
  </footer>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
